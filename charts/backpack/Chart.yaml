apiVersion: v2
name: backpack
description: Backpack, an engine for hoarding artifacts in disconnected environments. Deploys the API, GUI, gateway, collector router, collectors and processors.
type: application
# Chart version, bump it on every change. Pushing a new version to main
# publishes it.
version: 0.1.0
# Backpack image tag used when backpack.version is not set: the latest build
# of github.com/linus-berg/backpack, which publishes master-<commit>. Bump it
# together with gui.version in values.yaml.
appVersion: "master-a02a51f4aeafc15eadb5d35fbb7b9ac2f51c1201"
# policy/v1 PodDisruptionBudgets.
kubeVersion: ">=1.21.0-0"
home: https://linus-berg.github.io/backpack/
icon: https://raw.githubusercontent.com/linus-berg/backpack/master/images/backpack-256.png
sources:
  - https://github.com/linus-berg/backpack
  - https://github.com/linus-berg/backpack-gui
  - https://github.com/linus-berg/helm-charts
maintainers:
  - name: linus-berg
    url: https://github.com/linus-berg
keywords:
  - artifacts
  - mirror
  - air-gapped
  - offline
