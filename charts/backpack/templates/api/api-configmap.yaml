apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env-config
data:
  # Your environment variables go here
  BP_LOGS: "/logs/"
  BP_API_HOST: {{ .Values.api.host | quote }}
  BP_REDIS_HOST: {{ .Values.redis.host | quote }}
  BP_MONGO_STR: "mongodb://{{ .Values.mongo.user }}:{{ .Values.mongo.pass }}@{{ .Values.mongo.host }}:{{ .Values.mongo.port }}/"
