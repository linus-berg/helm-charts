# Credentials are in api-env-secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env-config
data:
  BP_LOGS: "/logs/"
  BP_API_HOST: {{ .Values.api.host | quote }}
  BP_REDIS_HOST: {{ .Values.redis.host | quote }}
  BP_REDIS_USER: {{ .Values.redis.user | quote }}
  BP_RABBIT_MQ_API: {{ .Values.rabbitmq.api | quote }}
