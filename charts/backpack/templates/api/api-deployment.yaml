apiVersion: apps/v1
kind: Deployment
metadata:
  name: backpack-api
  labels:
    {{- include "backpack.labels" (dict "root" $ "name" "backpack-api" "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backpack-api
  template:
    metadata:
      labels:
        {{- include "backpack.podLabels" (dict "root" $ "name" "backpack-api" "component" "api") | nindent 8 }}
      annotations:
        backpack/version: {{ .Values.api.tag | default (include "backpack.version" $) | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/common-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common-secret.yaml") . | sha256sum }}
        checksum/api-config: {{ include (print $.Template.BasePath "/api/api-configmap.yaml") . | sha256sum }}
        checksum/api-secret: {{ include (print $.Template.BasePath "/api/api-secret.yaml") . | sha256sum }}
        checksum/ca-certificates: {{ include (print $.Template.BasePath "/ca-certificates-configmap.yaml") . | sha256sum }}
    spec:
      {{- with include "backpack.pod.spec" (dict "root" $ "workload" .Values.api "hostAliases" true "ca" true) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: backpack-api
          image: {{ include "backpack.image" (dict "root" $ "workload" .Values.api "key" "api") }}
          {{- with include "backpack.container.spec" (dict "root" $ "workload" .Values.api "ca" true) | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: common-env-config
            - secretRef:
                name: {{ include "backpack.secretName" (dict "root" $ "secret" "common") }}
            - configMapRef:
                name: api-env-config
            - secretRef:
                name: {{ include "backpack.secretName" (dict "root" $ "secret" "api") }}
          ports:
            - name: http
              containerPort: 8080
