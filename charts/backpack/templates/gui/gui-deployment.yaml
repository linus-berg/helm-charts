---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backpack-gui
spec:
  replicas: {{ required ".Values.gui.replicas must be set" .Values.gui.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backpack-gui
  template:
    metadata:
      labels:
        app: backpack-gui
      annotations:
        backpack/version: {{ .Values.gui.version }}
    spec:
      {{- with include "backpack.pod.settings" (dict "root" $ "workload" .Values.gui) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - image: ghcr.io/linus-berg/backpack/gui:{{ required ".Values.gui.version must be set" .Values.gui.version }}
          name: backpack-gui
          {{- with include "backpack.container.settings" (dict "root" $ "workload" .Values.gui) | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
          - containerPort: 80
