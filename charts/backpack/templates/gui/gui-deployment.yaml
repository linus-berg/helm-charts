apiVersion: apps/v1
kind: Deployment
metadata:
  name: backpack-gui
  labels:
    {{- include "backpack.labels" (dict "root" $ "name" "backpack-gui" "component" "gui") | nindent 4 }}
spec:
  replicas: {{ required ".Values.gui.replicas must be set" .Values.gui.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backpack-gui
  template:
    metadata:
      labels:
        {{- include "backpack.podLabels" (dict "root" $ "name" "backpack-gui" "component" "gui") | nindent 8 }}
      annotations:
        backpack/version: {{ .Values.gui.version | quote }}
    spec:
      {{- with include "backpack.pod.spec" (dict "root" $ "workload" .Values.gui) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: backpack-gui
          {{- /* The GUI is versioned separately, so its tag is gui.version. */}}
          image: {{ include "backpack.image" (dict "root" $ "workload" (dict "image" .Values.gui.image "tag" (required ".Values.gui.version must be set" .Values.gui.version)) "key" "gui") }}
          {{- with include "backpack.container.spec" (dict "root" $ "workload" .Values.gui) | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
