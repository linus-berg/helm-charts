{{- /* Not created when existingSecrets.collector names a Secret you manage. */}}
{{- if not (get (.Values.existingSecrets | default (dict)) "collector") }}
apiVersion: v1
kind: Secret
metadata:
  name: collector-env-secret
  labels:
    {{- include "backpack.labels" (dict "root" $) | nindent 4 }}
type: Opaque
data:
  BP_S3_ACCESS_KEY: {{ .Values.s3.accessKey | default "" | toString | b64enc | quote }}
  BP_S3_SECRET_KEY: {{ .Values.s3.secretKey | default "" | toString | b64enc | quote }}
{{- end }}
