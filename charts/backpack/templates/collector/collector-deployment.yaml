{{- range $.Values.collectors }}
{{- if eq (include "backpack.collector.kind" .) "Deployment" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-{{ .id }}
  labels:
    app: collector-{{ .id }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: collector-{{ .id }}
  template:
    {{- include "backpack.collector.podTemplate" (dict "root" $ "collector" .) | nindent 4 }}
{{- end }}
{{- end }}
