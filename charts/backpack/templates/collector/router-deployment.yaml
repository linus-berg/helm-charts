---
# Collector Router (routes to the correct protocol collector)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-router
spec:
  replicas: {{ .Values.router.replicas }} 
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: collector-router
  template:
    metadata:
      labels:
        app: collector-router
      annotations:
        backpack/version: {{ .Values.backpack.version }}
        checksum/config: {{ include (print $.Template.BasePath "/common-configmap.yaml") . | sha256sum }}
    spec:
      {{- if $.Values.hosts }}
      hostAliases:
        {{- range $.Values.hosts }}
        - ip: {{ .ip | quote }}
          hostnames:
          {{- range .hostnames }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - image: ghcr.io/linus-berg/backpack/collector/router:{{ .Values.backpack.version }} 
          name: collector-router
          envFrom:
            - configMapRef:
                name: common-env-config
