# Collector router, routes every request to the queue of the collector for its protocol.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-router
  labels:
    {{- include "backpack.labels" (dict "root" $ "name" "collector-router" "component" "router") | nindent 4 }}
spec:
  replicas: {{ .Values.router.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: collector-router
  template:
    metadata:
      labels:
        {{- include "backpack.podLabels" (dict "root" $ "name" "collector-router" "component" "router") | nindent 8 }}
      annotations:
        backpack/version: {{ .Values.router.tag | default (include "backpack.version" $) | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/common-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common-secret.yaml") . | sha256sum }}
    spec:
      {{- with include "backpack.pod.spec" (dict "root" $ "workload" .Values.router "hostAliases" true) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: collector-router
          image: {{ include "backpack.image" (dict "root" $ "workload" .Values.router "key" "router") }}
          {{- with include "backpack.container.spec" (dict "root" $ "workload" .Values.router) | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: common-env-config
            - secretRef:
                name: {{ include "backpack.secretName" (dict "root" $ "secret" "common") }}
