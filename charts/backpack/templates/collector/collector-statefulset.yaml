{{- range $.Values.collectors }}
{{- if eq (include "backpack.collector.kind" .) "StatefulSet" }}
{{- $collectorId := .id }}
---
# Headless service governing the StatefulSet, collectors expose no ports.
apiVersion: v1
kind: Service
metadata:
  name: collector-{{ .id }}
  labels:
    app: collector-{{ .id }}
spec:
  clusterIP: None
  selector:
    app: collector-{{ .id }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collector-{{ .id }}
  labels:
    app: collector-{{ .id }}
spec:
  serviceName: collector-{{ .id }}
  replicas: {{ .replicas }}
  # Replicas compete on the same queue and never depend on each other.
  podManagementPolicy: Parallel
  {{- with .persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: collector-{{ .id }}
  template:
    {{- include "backpack.collector.podTemplate" (dict "root" $ "collector" .) | nindent 4 }}
  {{- if .extraVolumes }}
  # Every replica gets its own claim per volume (<name>-collector-<id>-<ordinal>).
  # The claims are not owned by Helm, so unless persistentVolumeClaimRetentionPolicy
  # says otherwise they outlive upgrades, scale-downs and uninstalls.
  volumeClaimTemplates:
    {{- range .extraVolumes }}
    - metadata:
        name: {{ .name }}
        labels:
          app: collector-{{ $collectorId }}
      spec:
        accessModes:
          - {{ .accessMode | default "ReadWriteOnce" }}
        resources:
          requests:
            storage: {{ .size | default "1Gi" }}
        {{- if .storageClass }}
        storageClassName: {{ .storageClass }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
