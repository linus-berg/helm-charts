{{- /* Not created when existingSecrets.credentials names a Secret you manage. */}}
{{- include "backpack.credentials.validate" . }}
{{- if and .Values.credentials (not (get (.Values.existingSecrets | default (dict)) "credentials")) }}
# Credentials for private sources, mounted into the workers that set
# mountCredentials: true. See "Private sources" in README.md.
apiVersion: v1
kind: Secret
metadata:
  name: credentials-secret
  labels:
    {{- include "backpack.labels" (dict "root" $) | nindent 4 }}
type: Opaque
data:
  credentials.json: {{ include "backpack.credentials.json" . | b64enc | quote }}
  {{- range $host, $credential := .Values.credentials }}
  {{- if not $credential.tokenSecret }}
  token-{{ include "backpack.credentials.slug" $host }}: {{ $credential.token | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
