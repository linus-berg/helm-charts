{{- /* Not created when existingSecrets.gateway names a Secret you manage. */}}
{{- if not (get (.Values.existingSecrets | default (dict)) "gateway") }}
apiVersion: v1
kind: Secret
metadata:
  name: gateway-env-secret
  labels:
    {{- include "backpack.labels" (dict "root" $) | nindent 4 }}
type: Opaque
data:
  BP_REDIS_PASS: {{ .Values.redis.pass | default "" | toString | b64enc | quote }}
  BP_MONGO_STR: {{ include "backpack.mongo.connectionString" . | b64enc | quote }}
{{- end }}
