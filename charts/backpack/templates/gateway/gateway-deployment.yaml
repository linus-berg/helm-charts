apiVersion: apps/v1
kind: Deployment
metadata:
  name: backpack-gateway
  labels:
    {{- include "backpack.labels" (dict "root" $ "name" "backpack-gateway" "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ required ".Values.ingestion.replicas must be set" .Values.ingestion.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backpack-gateway
  template:
    metadata:
      labels:
        {{- include "backpack.podLabels" (dict "root" $ "name" "backpack-gateway" "component" "gateway") | nindent 8 }}
      annotations:
        backpack/version: {{ .Values.ingestion.tag | default (include "backpack.version" $) | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/common-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common-secret.yaml") . | sha256sum }}
        checksum/gateway-config: {{ include (print $.Template.BasePath "/gateway/gateway-configmap.yaml") . | sha256sum }}
        checksum/gateway-secret: {{ include (print $.Template.BasePath "/gateway/gateway-secret.yaml") . | sha256sum }}
    spec:
      {{- with include "backpack.pod.spec" (dict "root" $ "workload" .Values.ingestion "hostAliases" true) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: backpack-gateway
          image: {{ include "backpack.image" (dict "root" $ "workload" .Values.ingestion "key" "ingestion") }}
          {{- with include "backpack.container.spec" (dict "root" $ "workload" .Values.ingestion) | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: common-env-config
            - secretRef:
                name: {{ include "backpack.secretName" (dict "root" $ "secret" "common") }}
            - configMapRef:
                name: gateway-env-config
            - secretRef:
                name: {{ include "backpack.secretName" (dict "root" $ "secret" "gateway") }}
