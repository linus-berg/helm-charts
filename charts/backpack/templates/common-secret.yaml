{{- /* Not created when existingSecrets.common names a Secret you manage. */}}
{{- if not (get (.Values.existingSecrets | default (dict)) "common") }}
# Credentials read by every component except the GUI. The non-sensitive
# settings are in common-env-config.
apiVersion: v1
kind: Secret
metadata:
  name: common-env-secret
  labels:
    {{- include "backpack.labels" (dict "root" $) | nindent 4 }}
type: Opaque
data:
  BP_RABBIT_MQ_PASS: {{ required ".Values.rabbitmq.pass must be set" .Values.rabbitmq.pass | toString | b64enc | quote }}
{{- /* Proxy URLs can carry credentials (http://user:pass@proxy:3128). */}}
{{- with .Values.http_proxy }}
{{- $proxy := toString . | b64enc | quote }}
  HTTP_PROXY: {{ $proxy }}
  HTTPS_PROXY: {{ $proxy }}
  http_proxy: {{ $proxy }}
  https_proxy: {{ $proxy }}
{{- end }}
{{- end }}
