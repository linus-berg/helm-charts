{{- range .Values.processors }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-{{ .id }}
  labels:
    app: processor-{{ .id }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: processor-{{ .id }}
  template:
    metadata:
      labels:
        app: processor-{{ .id }}
      annotations:
        backpack/version: {{ $.Values.backpack.version }}
        checksum/config: {{ include (print $.Template.BasePath "/common-configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/common-secret.yaml") $ | sha256sum }}
        checksum/ca-certificates: {{ include (print $.Template.BasePath "/ca-certificates-configmap.yaml") $ | sha256sum }}
    spec:
      {{- with include "backpack.pod.settings" (dict "root" $ "workload" .) | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if .imagePullSecrets }}
      imagePullSecrets:
        {{- range .imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if $.Values.hosts }}
      hostAliases:
        {{- range $.Values.hosts }}
        - ip: {{ .ip | quote }}
          hostnames:
          {{- range .hostnames }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if or $.Values.ca_certificates .extraVolumes }}
      volumes:
        {{- if $.Values.ca_certificates }}
        - name: ca-certificates-config-volume
          configMap:
            name: ca-certificates
        {{- end }}
        {{- if .extraVolumes }}
        {{- $processorId := .id }}
        {{- range .extraVolumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: processor-{{ $processorId }}-{{ .name }}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: processor-{{ .id }}
          image: {{ .image }}:{{ .tag }}
          {{- with include "backpack.container.settings" (dict "root" $ "workload" .) | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          volumeMounts:
            {{- if $.Values.ca_certificates }}
            - mountPath: /etc/ssl/certs/ca-certificates.crt 
              name: ca-certificates-config-volume
              subPath: ca-certificates.crt
            {{- end }}
            {{- if .extraVolumes }}
            {{- range .extraVolumes }}
            - mountPath: {{ .mountPath }}
              name: {{ .name }}
            {{- end }}
            {{- end }}
          {{- with .env }}
          env:
            {{- include "backpack.env" . | trim | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: common-env-config
            - secretRef:
                name: common-env-secret
{{- end}}
