{{- range .Values.processors }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-{{ .id }}
  labels:
    app: processor-{{ .id }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: processor-{{ .id }}
  template:
    metadata:
      labels:
        app: processor-{{ .id }}
      annotations:
        backpack/version: {{ $.Values.backpack.version }}
        checksum/config: {{ include (print $.Template.BasePath "/common-configmap.yaml") $ | sha256sum }}
    spec:
      {{- if .imagePullSecrets }}
      imagePullSecrets:
        {{- range .imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if $.Values.hosts }}
      hostAliases:
        {{- range $.Values.hosts }}
        - ip: {{ .ip | quote }}
          hostnames:
          {{- range .hostnames }}
            - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if $.Values.ca_certificates }}
      volumes:
        - name: ca-certificates-config-volume
          configMap:
            name: common-env-config
      {{- end }}
      containers:
        - name: processor-{{ .id }}
          image: {{ .image }}:{{ .tag }}
          {{- if $.Values.ca_certificates }}
          volumeMounts:
            - mountPath: /etc/ssl/certs/ca-certificates.crt 
              name: ca-certificates-config-volume
              subPath: ca-certificates.crt
          {{- end }}
          {{- if .env }}
          env:
            {{- range $key, $val := .env }}
            - name: {{ $val.name }}
              value: {{ $val.value | quote }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: common-env-config
{{- end}}
