{{- /*
One PodDisruptionBudget per workload that sets podDisruptionBudget, which is
used as the PDB spec (minAvailable or maxUnavailable, optionally
unhealthyPodEvictionPolicy). The selector is filled in by the chart.
*/}}
{{- $workloads := list
  (dict "name" "backpack-api" "key" "api" "values" .Values.api "component" "api")
  (dict "name" "backpack-gui" "key" "gui" "values" .Values.gui "component" "gui")
  (dict "name" "backpack-gateway" "key" "ingestion" "values" .Values.ingestion "component" "gateway")
  (dict "name" "collector-router" "key" "router" "values" .Values.router "component" "router") }}
{{- range $type, $workers := dict "collector" .Values.collectors "processor" .Values.processors }}
{{- range $workers }}
{{- $ctx := dict "root" $ "worker" . "type" $type }}
{{- $workloads = append $workloads (dict "name" (include "backpack.worker.name" $ctx) "key" (include "backpack.worker.key" $ctx) "values" . "component" $type) }}
{{- end }}
{{- end }}
{{- range $workloads }}
{{- $name := .name }}
{{- $key := .key }}
{{- $component := .component }}
{{- with (.values | default (dict)).podDisruptionBudget }}
{{- if and (hasKey . "minAvailable") (hasKey . "maxUnavailable") }}
{{- fail (printf "%s.podDisruptionBudget: set minAvailable or maxUnavailable, not both" $key) }}
{{- end }}
{{- if hasKey . "selector" }}
{{- fail (printf "%s.podDisruptionBudget: selector is set by the chart" $key) }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "backpack.labels" (dict "root" $ "name" $name "component" $component) | nindent 4 }}
spec:
  {{- toYaml . | nindent 2 }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
