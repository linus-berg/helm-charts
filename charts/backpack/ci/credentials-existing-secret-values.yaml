# Credentials from a Secret you manage, mounted into a collector Deployment
# and a processor.
rabbitmq:
  host: rabbitmq
  user: backpack
  pass: secret
existingSecrets:
  credentials: backpack-credentials
collectors:
  - id: git
    image: ghcr.io/linus-berg/backpack/collector/git
    replicas: 1
    mountCredentials: true
    env:
      - name: GIT_HTTP_LOW_SPEED_LIMIT
        value: 1000
processors:
  - id: github-releases
    image: ghcr.io/linus-berg/backpack/processor/github-releases
    replicas: 1
    mountCredentials: true
