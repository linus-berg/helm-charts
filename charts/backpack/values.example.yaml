# Default values for Backpack-Helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

backpack:
  version: &backpack_version "fe27ea40be7f5e6d4d358ffbd7215681b5b7cd2c"
  log:
    level: Information

#http_proxy: "127.0.0.1"

#no_proxy:
  #- google.com
  #- github.com

hosts:
  - ip: 127.1.1.1
    hostnames: 
      - foo.bar
  - ip: 127.1.1.2
    hostnames: 
      - foo.foo

# CA
ca_certificates: |
  test

# Pod settings for every workload that doesn't set its own. A workload's own
# value replaces the default; set it to {} or [] to opt out. Probes and
# podDisruptionBudget have no default. See "Pod settings" in README.md.
#defaults:
  #podSecurityContext:
    #fsGroup: 1000
  #securityContext:
    #allowPrivilegeEscalation: false
  #resources:
    #requests:
      #cpu: 50m
      #memory: 128Mi
  #nodeSelector:
    #kubernetes.io/os: linux
  #tolerations: []
  #affinity: {}

# Authentication (OIDC)
oidc:
  authority: "http://localhost:8090/realms/master"
  audience: "backpack"

# API
api:
  host: "localhost"
  loadBalancerIP: 192.168.49.100
  port: 8004
  replicas: 4
  # api, gui, ingestion, router and every collector and processor take the
  # same pod settings, e.g.:
  #resources:
    #limits:
      #memory: 1Gi
  #readinessProbe:
    #tcpSocket:
      #port: 8080
  #podDisruptionBudget:
    #maxUnavailable: 1

# Ingestion
ingestion:
  replicas: 4

# GUI
gui:
  version: "c0cdfeacab02641551e9bd0758427b7fb4578424"
  loadBalancerIP: 192.168.49.101
  port: 8080
  replicas: 4

router:
  replicas: 8

# General settings
rabbitmq:
  api: http://host.minikube.internal:15672
  host: host.minikube.internal
  user: guest
  pass: guest

mongo:
  host: host.minikube.internal
  port: 27017
  user: root
  pass: example

redis:
  host: "host.minikube.internal"
  user: "default"
  pass: "example"

#otel:
  #host: "otel"

# Collector specific
s3:
  accessKey: "minio-bp"
  secretKey: "minio-bp"
  region: ""
  endpoint: "host.minikube.internal:9000"
  bucket: "backpack"

##
collectors:
  - id: "http"
    image: "ghcr.io/linus-berg/backpack/collector/http"
    tag: *backpack_version
    replicas: 1
    extraVolumes:
      - name: data
        mountPath: /data
        storageClass: standard
        size: 10Gi
  # Git keeps a `git clone --mirror` of every repository under /data and only
  # fetches what changed on the next collect. As a StatefulSet each replica
  # gets its own claim that survives restarts, rollouts and uninstalls.
  # See "Collector storage" in README.md before changing replicas or volumes.
  - id: "git"
    image: "ghcr.io/linus-berg/backpack/collector/git"
    tag: *backpack_version
    kind: StatefulSet
    replicas: 1
    #persistentVolumeClaimRetentionPolicy:
      #whenDeleted: Retain
      #whenScaled: Retain
    extraVolumes:
      - name: data
        mountPath: /data
        storageClass: standard
        size: 10Gi
  - id: "container"
    image: "ghcr.io/linus-berg/backpack/collector/container"
    tag: *backpack_version
    replicas: 1
    extraVolumes:
      - name: data
        mountPath: /data
        storageClass: standard
        size: 10Gi

processors:
  - id: "npm"
    image: "ghcr.io/linus-berg/backpack/processor/npm"
    tag: *backpack_version
    replicas: 1
    extraVolumes:
      - name: cache
        mountPath: /root/.npm
        storageClass: standard
        size: 5Gi
    imagePullSecrets: 
      - test
    env:
      - name: TEST
        value: BLEH
  - id: nuget
    image: ghcr.io/linus-berg/backpack/processor/nuget
    tag: *backpack_version
    replicas: 1
  
  - id: pypi
    image: ghcr.io/linus-berg/backpack/processor/pypi
    tag: *backpack_version
    replicas: 1
    
  - id: container
    image: ghcr.io/linus-berg/backpack/processor/container
    tag: *backpack_version
    replicas: 1
    
  - id: rancher
    image: ghcr.io/linus-berg/backpack/processor/rancher
    tag: *backpack_version
    replicas: 1
    
  - id: helm
    image: ghcr.io/linus-berg/backpack/processor/helm
    tag: *backpack_version
    replicas: 1
    # Read from a Secret, so the keys stay out of the values and the pod spec:
    # kubectl create secret generic artifacthub --from-literal=id=... --from-literal=secret=...
    env:
      - name: ARTIFACTHUB_API_KEY_ID
        valueFrom:
          secretKeyRef:
            name: artifacthub
            key: id
      - name: ARTIFACTHUB_API_KEY_SECRET
        valueFrom:
          secretKeyRef:
            name: artifacthub
            key: secret
    
  - id: jetbrains
    image: ghcr.io/linus-berg/backpack/processor/jetbrains
    tag: *backpack_version
    replicas: 1
    
  - id: jetbrains-ide
    image: ghcr.io/linus-berg/backpack/processor/jetbrains/ide
    tag: *backpack_version
    replicas: 1
  
  - id: php
    image: ghcr.io/linus-berg/backpack/processor/php
    tag: *backpack_version
    replicas: 1
  
  - id: github-releases
    image: ghcr.io/linus-berg/backpack/processor/github/releases
    tag: *backpack_version
    replicas: 1
