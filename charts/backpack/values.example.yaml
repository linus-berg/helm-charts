# Example values for a development cluster (minikube) with RabbitMQ, MongoDB,
# Redis, MinIO and Keycloak running on the host. values.yaml has the defaults
# of every key and README.md documents them.

backpack:
  # Defaults to the chart's appVersion. Set it to run another build, images
  # are tagged master-<commit>:
  #version: master-a02a51f4aeafc15eadb5d35fbb7b9ac2f51c1201
  log:
    level: Information

#http_proxy: "http://proxy.example.com:3128"
#no_proxy:
  #- example.com

#hosts:
  #- ip: 192.168.49.1
    #hostnames:
      #- minio.local

# CA bundle replacing the images' bundle, e.g. your internal CA plus the
# public roots:
#ca_certificates: |
  #-----BEGIN CERTIFICATE-----
  #...
  #-----END CERTIFICATE-----

# Pod settings for every workload that doesn't set its own. A workload's own
# value replaces the default; set it to {} or [] to opt out. Probes and
# podDisruptionBudget have no default. See "Pod settings" in README.md.
#defaults:
  #imagePullSecrets:
    #- my-registry
  #podSecurityContext:
    #fsGroup: 1000
  #securityContext:
    #allowPrivilegeEscalation: false
  #resources:
    #requests:
      #cpu: 50m
      #memory: 128Mi
  #nodeSelector:
    #kubernetes.io/os: linux
  #tolerations: []
  #affinity: {}

# Authentication (OIDC)
oidc:
  authority: "http://localhost:8090/realms/master"
  audience: "backpack"

# API
api:
  host: "localhost"
  loadBalancerIP: 192.168.49.100
  port: 8004
  replicas: 4
  # api, gui, ingestion, router and every collector and processor take the
  # same pod settings, e.g.:
  #resources:
    #limits:
      #memory: 1Gi
  #readinessProbe:
    #tcpSocket:
      #port: 8080
  #podDisruptionBudget:
    #maxUnavailable: 1
  # Behind an ingress controller instead of a LoadBalancer:
  #service:
    #type: ClusterIP
  #ingress:
    #enabled: true
    #className: nginx
    #hosts:
      #- host: api.backpack.local

# Gateway
ingestion:
  replicas: 4

# GUI
gui:
  loadBalancerIP: 192.168.49.101
  port: 8080
  replicas: 4

router:
  replicas: 8

# General settings
rabbitmq:
  api: http://host.minikube.internal:15672
  host: host.minikube.internal
  user: guest
  pass: guest

mongo:
  host: host.minikube.internal
  port: 27017
  user: root
  pass: example

redis:
  host: "host.minikube.internal"
  user: "default"
  pass: "example"

#otel:
  #host: "otel"

# Collector specific
s3:
  accessKey: "minio-bp"
  secretKey: "minio-bp"
  region: ""
  endpoint: "host.minikube.internal:9000"
  bucket: "backpack"

# Instead of the credentials above, use Secrets you manage (see
# "Credentials" in README.md):
#existingSecrets:
  #common: backpack-common
  #api: backpack-api
  #gateway: backpack-api
  #collector: backpack-s3
  #credentials: backpack-credentials

# Credentials for private repositories, e.g. on a GitHub Enterprise instance.
# Only the collectors with mountCredentials: true get them.
#credentials:
  #ghe.example.com:
    #username: backpack-mirror
    #tokenSecret:
      #name: ghe-token
      #key: token

# Every entry runs the latest image (backpack.version) unless it sets its own
# tag.
collectors:
  # Streams to S3, needs no volume.
  - id: "http"
    image: "ghcr.io/linus-berg/backpack/collector/http"
    replicas: 1
  # Git keeps a `git clone --mirror` of every repository under /data and only
  # fetches what changed on the next collect. As a StatefulSet each replica
  # gets its own claim that survives restarts, rollouts and uninstalls.
  # See "Collector storage" in README.md before changing replicas or volumes.
  - id: "git"
    image: "ghcr.io/linus-berg/backpack/collector/git"
    kind: StatefulSet
    replicas: 1
    #persistentVolumeClaimRetentionPolicy:
      #whenDeleted: Retain
      #whenScaled: Retain
    extraVolumes:
      - name: data
        mountPath: /data
        storageClass: standard
        size: 10Gi
    # Needed to mirror private repositories, see credentials above.
    #mountCredentials: true
  # Copies images registry to registry, needs no volume.
  - id: "container"
    image: "ghcr.io/linus-berg/backpack/collector/container"
    replicas: 1
    # The registry images are copied into. Every collect fails without it.
    #env:
      #- name: BP_COLLECTOR_CONTAINER_REGISTRY
        #value: registry.example.com

processors:
  # The cache is a ReadWriteOnce claim, so the chart rolls this Deployment
  # out with the Recreate strategy.
  - id: "npm"
    image: "ghcr.io/linus-berg/backpack/processor/npm"
    replicas: 1
    extraVolumes:
      - name: cache
        mountPath: /root/.npm
        storageClass: standard
        size: 5Gi
  - id: nuget
    image: ghcr.io/linus-berg/backpack/processor/nuget
    replicas: 1

  - id: pypi
    image: ghcr.io/linus-berg/backpack/processor/pypi
    replicas: 1

  - id: container
    image: ghcr.io/linus-berg/backpack/processor/container
    replicas: 1

  - id: rancher
    image: ghcr.io/linus-berg/backpack/processor/rancher
    replicas: 1

  - id: helm
    image: ghcr.io/linus-berg/backpack/processor/helm
    replicas: 1
    # Read from a Secret, so the keys stay out of the values and the pod spec:
    # kubectl create secret generic artifacthub --from-literal=id=... --from-literal=secret=...
    env:
      - name: ARTIFACTHUB_API_KEY_ID
        valueFrom:
          secretKeyRef:
            name: artifacthub
            key: id
      - name: ARTIFACTHUB_API_KEY_SECRET
        valueFrom:
          secretKeyRef:
            name: artifacthub
            key: secret

  - id: jetbrains
    image: ghcr.io/linus-berg/backpack/processor/jetbrains-plugins
    replicas: 1

  - id: jetbrains-ide
    image: ghcr.io/linus-berg/backpack/processor/jetbrains-ide
    replicas: 1

  - id: github-releases
    image: ghcr.io/linus-berg/backpack/processor/github-releases
    replicas: 1
