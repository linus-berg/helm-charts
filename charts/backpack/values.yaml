# Default values of the Backpack chart. README.md documents every key and
# values.example.yaml is a complete example.

backpack:
  # Image tag of the API, gateway and router, and of every collector and
  # processor without its own tag. Empty means the chart's appVersion.
  version: ""
  log:
    # Default .NET log level (LOGGING__LOGLEVEL__DEFAULT).
    level: Information

# HTTP_PROXY/HTTPS_PROXY for everything except the GUI. Stored in a Secret,
# since proxy URLs can carry credentials.
http_proxy: ""
# Hosts joined into NO_PROXY.
no_proxy: []

# hostAliases of every pod except the GUI, e.g.
#   - ip: 10.0.0.10
#     hostnames: [minio.internal]
hosts: []

# PEM bundle mounted over /etc/ssl/certs/ca-certificates.crt in the API,
# collectors and processors. It replaces the image's bundle, so include the
# public roots too if those need to reach the internet.
ca_certificates: ""

oidc:
  # OIDC realm URL (BP_OIDC_AUTHORITY).
  authority: ""
  # Expected aud claim / client ID (BP_OIDC_AUDIENCE).
  audience: ""

otel:
  # OpenTelemetry collector endpoint (BP_OTEL_HOST), not set when empty.
  host: ""

# Secrets you manage, used instead of the ones the chart creates from the
# credentials below. Each must hold the keys of the Secret it replaces, see
# "Credentials" in README.md.
existingSecrets:
  # Replaces common-env-secret: BP_RABBIT_MQ_PASS, plus the proxy variables
  # if you use a proxy.
  common: ""
  # Replaces api-env-secret: BP_REDIS_PASS, BP_MONGO_STR.
  api: ""
  # Replaces gateway-env-secret: BP_REDIS_PASS, BP_MONGO_STR.
  gateway: ""
  # Replaces collector-env-secret: BP_S3_ACCESS_KEY, BP_S3_SECRET_KEY.
  collector: ""

# Pod settings of every workload that doesn't set its own. A workload's own
# value replaces the default as a whole; set it to {} or [] to opt out. See
# "Pod settings" in README.md for all keys a workload takes.
defaults:
  # Names of Secrets to pull images with.
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  image: ghcr.io/linus-berg/backpack/integration/api
  # Empty means backpack.version.
  tag: ""
  # Public URL of the API (BP_API_HOST).
  host: ""
  replicas: 1
  # Service port, forwarded to container port 8080.
  port: 8080
  service:
    # ClusterIP, NodePort or LoadBalancer.
    type: LoadBalancer
    annotations: {}
    # Node port for NodePort and LoadBalancer Services, picked by Kubernetes when unset.
    # nodePort: 30080
  # Requested IP of a LoadBalancer Service. Deprecated by Kubernetes, many
  # providers take it as an annotation in service.annotations instead.
  loadBalancerIP: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # - host: api.backpack.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    hosts: []
    # - secretName: backpack-api-tls
    #   hosts: [api.backpack.example.com]
    tls: []
  # Takes the pod settings from README.md too, e.g.
  # resources:
  #   limits:
  #     memory: 1Gi
  # readinessProbe:
  #   tcpSocket:
  #     port: 8080
  # podDisruptionBudget:
  #   maxUnavailable: 1

gui:
  image: ghcr.io/linus-berg/backpack/gui
  # Image tag of the GUI, which is versioned separately from backpack.version.
  version: "d7218050fc21d460f47d83a7e9b38915e97053ef"
  replicas: 1
  # Service port, forwarded to container port 80.
  port: 80
  service:
    type: LoadBalancer
    annotations: {}
  loadBalancerIP: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

# The gateway.
ingestion:
  image: ghcr.io/linus-berg/backpack/core/gateway
  tag: ""
  replicas: 1

# The collector router.
router:
  image: ghcr.io/linus-berg/backpack/collector/router
  tag: ""
  replicas: 1

rabbitmq:
  host: ""
  user: ""
  pass: ""
  # Management API URL, used by the API.
  api: ""

mongo:
  host: ""
  port: 27017
  # Percent-encoded by the chart, give them as they are.
  user: ""
  pass: ""

redis:
  host: ""
  user: ""
  pass: ""

# Object storage the collectors upload to.
s3:
  endpoint: ""
  region: ""
  bucket: ""
  accessKey: ""
  secretKey: ""

# One entry per collector, see "Collectors" in README.md, e.g.
#   - id: git
#     image: ghcr.io/linus-berg/backpack/collector/git
#     kind: StatefulSet
#     replicas: 1
#     extraVolumes:
#       - name: data
#         mountPath: /data
#         size: 100Gi
collectors: []

# One entry per processor, see "Processors" in README.md, e.g.
#   - id: npm
#     image: ghcr.io/linus-berg/backpack/processor/npm
#     replicas: 1
processors: []
